# Notify Weft to rebuild agent images when codebuff is updated.
# Sends a repository_dispatch event to reillyse/weft which triggers
# the docker-publish workflow to rebuild the agent image with the
# latest codebuff-lite binary.
#
# The dispatch is gated on a preflight job that runs the same E2E
# guard/tests as the nightly pipeline, so a broken build never
# propagates a fresh codebuff-lite binary into weft's agent images.
#
# Uses CODEBUFF_GITHUB_TOKEN (a PAT with repo scope that covers
# both reillyse/codebuff and reillyse/weft).

name: Notify Weft

on:
  push:
    branches:
      - reillyse/hippo-integration

jobs:
  preflight:
    name: Preflight E2E Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            */node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-deps-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set environment variables
        env:
          SECRETS_CONTEXT: ${{ toJSON(secrets) }}
        run: |
          VAR_NAMES=$(bun scripts/generate-ci-env.ts)
          echo "$SECRETS_CONTEXT" | jq -r --argjson vars "$VAR_NAMES" '
            to_entries | .[] | select(.key as $k | $vars | index($k)) | .key + "=" + .value
          ' >> $GITHUB_ENV
          echo "CODEBUFF_GITHUB_ACTIONS=true" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_CB_ENVIRONMENT=test" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_INFISICAL_UP=true" >> $GITHUB_ENV
          echo "CODEBUFF_GITHUB_TOKEN=${{ secrets.CODEBUFF_GITHUB_TOKEN }}" >> $GITHUB_ENV

      - name: Guard against deprecated Grok model references
        run: bun scripts/check-no-grok-models.ts

      - name: Build SDK
        run: cd sdk && bun run build

      - name: Run .agents unit tests
        run: cd .agents && bun run test

      - name: Run .agents e2e tests
        run: cd .agents && bun run test:e2e --timeout=120000

      - name: Cleanup e2e database
        if: always()
        run: bun --cwd packages/internal db:e2e:down

  notify:
    name: Trigger Weft Agent Rebuild
    runs-on: ubuntu-latest
    # Only dispatch to weft if preflight checks passed, so a broken
    # build never propagates into weft's agent images.
    needs: preflight
    steps:
      - name: Dispatch codebuff-updated event to weft
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.CODEBUFF_GITHUB_TOKEN }}
          repository: reillyse/weft
          event-type: codebuff-updated
          client-payload: '{"sha": "${{ github.sha }}", "ref": "${{ github.ref }}", "message": ${{ toJSON(github.event.head_commit.message) }}}'
